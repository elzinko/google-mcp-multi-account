site_name: google-multi-account
site_description: Multi-account Google Workspace for LLM agents — 100% local.
# Real publication URL — GitHub Pages (no custom domain).
site_url: https://elzinko.github.io/google-mcp-multi-account/
repo_url: https://github.com/elzinko/google-mcp-multi-account
repo_name: elzinko/google-mcp-multi-account
edit_uri: edit/main/docs/
copyright: MIT — built on spare time.

# docs/ = markdown source (already in the repo); _site/ = build served by Vercel
# (separate from the hand-made site/ landing). See fiche 0072.
docs_dir: docs
site_dir: _site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Prerequisites: setup-oauth.md
      - Install & update: mcp-setup.md
  - Configure:
      - Connect an LLM client: connect-client.md
  - Use:
      - CLI (mag): usage.md
      - Web admin: admin.md
  - Security:
      - Policy model: policies.md
      - Threat model: threat-model.md
      - Honest critique: critique.md
  - Under the hood:
      - Architecture: architecture.md
      - Decisions (ADR):
          - How to read these decisions: adr/index.md
          - ADR-0001 · Onboarding by elicitation: adr/ADR-0001-onboarding-by-elicitation.md
          - ADR-0002 · Email metadata outside the lock: adr/ADR-0002-email-metadata-outside-lock.md
          - ADR-0003 · Drive content via broker deposit: adr/ADR-0003-drive-content-via-broker-deposit.md
          - ADR-0004 · Admin master-list accordion: adr/ADR-0004-admin-master-list-accordion.md
          - ADR-0005 · Signed elicitation v2: adr/ADR-0005-signed-elicitation-v2.md
          - ADR-0006 · Received files, dedicated directory: adr/ADR-0006-received-files-dedicated-directory.md
          - ADR-0007 · Per-session rights: adr/ADR-0007-per-session-rights.md
          - ADR-0008 · Mobile access — passkey + native holder: adr/ADR-0008-mobile-access-passkey-native-holder.md
          - ADR-0009 · Remote passkey approval: adr/ADR-0009-remote-passkey-approval.md
          - ADR-0010 · Admin design system without a build: adr/ADR-0010-admin-design-system-no-build.md
          - ADR-0011 · Transactional consent per session: adr/ADR-0011-transactional-consent-per-session.md
          - ADR-0012 · Transactional consent — propagation: adr/ADR-0012-transactional-consent-propagation.md
          - ADR-0013 · Consent "once / for the session": adr/ADR-0013-consent-once-or-session.md
          - ADR-0014 · gmail_labels_modify in the transactional model: adr/ADR-0014-gmail-labels-modify-transactional.md
  - Contribute:
      - How to contribute: contributing.md
      - PR validation: PR_VALIDATION.md
      - GitHub security: github-security.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/elzinko/google-mcp-multi-account
      name: GitHub
