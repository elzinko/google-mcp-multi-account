<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="google-multi-account — Multi-account Google Workspace for agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1c22"/>
      <stop offset="1" stop-color="#0b171c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="14%" cy="16%" r="60%">
      <stop offset="0" stop-color="#1f8a72" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1f8a72" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="90%" cy="96%" r="55%">
      <stop offset="0" stop-color="#2a5563" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2a5563" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="250" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="250" rx="20" fill="url(#glowA)"/>
  <rect width="1000" height="250" rx="20" fill="url(#glowB)"/>
  <rect x="1" y="1" width="998" height="248" rx="19" fill="none" stroke="#2a3b42" stroke-opacity="0.9"/>

  <text x="500" y="60" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="3.5" fill="#6fd8bd">LOCAL-FIRST · MCP SERVER</text>

  <text x="500" y="126" text-anchor="middle" font-family="'Outfit', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#eef4f6">google-multi-account</text>

  <text x="500" y="164" text-anchor="middle" font-family="'Figtree', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#a7bcc4">Multi-account Google Workspace for agents</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14">
    <rect x="360" y="196" width="80" height="30" rx="8" fill="#123528" stroke="#1f8a72"/>
