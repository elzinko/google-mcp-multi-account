<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="google-multi-account — Multi-account Google Workspace for agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fa"/>
      <stop offset="1" stop-color="#e7eff1"/>
    </linearGradient>
    <radialGradient id="glowA" cx="14%" cy="16%" r="60%">
      <stop offset="0" stop-color="#0f6e56" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0f6e56" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="90%" cy="96%" r="55%">
      <stop offset="0" stop-color="#163039" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#163039" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="250" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="250" rx="20" fill="url(#glowA)"/>
  <rect width="1000" height="250" rx="20" fill="url(#glowB)"/>
  <rect x="1" y="1" width="998" height="248" rx="19" fill="none" stroke="#c9d8dd" stroke-opacity="0.7"/>

  <text x="500" y="60" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="3.5" fill="#0a4f3e">LOCAL-FIRST · MCP SERVER</text>

  <text x="500" y="126" text-anchor="middle" font-family="'Outfit', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#14212b">google-multi-account</text>

  <text x="500" y="164" text-anchor="middle" font-family="'Figtree', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#3d555e">Multi-account Google Workspace for agents</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14">
    <rect x="360" y="196" width="80" height="30" rx="8" fill="#d8efe6" stroke="#0f6e56"/>
